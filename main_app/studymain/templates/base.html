<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyApp{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-900">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                
                <div class="flex items-center space-x-8">
                    <a class="flex items-center space-x-2 text-xl font-black text-gray-800 tracking-tight" href="{% url 'home' %}">
                        <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm font-black">S</div>
                        <span>StudyApp</span>
                    </a>
                    
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="{% url 'home' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-650 hover:text-gray-900 hover:bg-gray-50 transition">Home</a>
                        <a href="{% url 'folders' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-650 hover:text-gray-900 hover:bg-gray-50 transition">Folders</a>
                        <a href="{% url 'quizselect' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-650 hover:text-gray-900 hover:bg-gray-50 transition">Lesson</a>
                        <a href="{% url 'viewquizzes' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-650 hover:text-gray-900 hover:bg-gray-50 transition">View Quizzes</a>
                        <a href="{% url 'createquiz' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-650 hover:text-gray-900 hover:bg-gray-50 transition">Create Quiz</a>
                    </div>
                </div>

                <div class="flex items-center md:hidden">
                    <button id="mobileMenuBtn" type="button" 
                        class="p-2 rounded-xl text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none transition">
                        <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>

            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden border-t border-gray-100 bg-white px-4 pt-2 pb-4 space-y-1 shadow-inner">
            <a href="{% url 'home' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Home</a>
            <a href="{% url 'folders' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Folders</a>
            <a href="{% url 'quizselect' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Lesson</a>
            <a href="{% url 'createquiz' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Create Quiz</a>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const menuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuIcon = document.getElementById('menuIcon');

        menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            
            // Swap icons dynamically depending on layout status
            if (isHidden) {
                menuIcon.className = "fa-solid fa-bars text-xl";
            } else {
                menuIcon.className = "fa-solid fa-xmark text-xl";
            }
        });
    </script>
</body>
</html>
