<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyApp{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block headers %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    {% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-900">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                
                <div class="flex items-center space-x-8">
                    <a class="flex items-center space-x-2 text-xl font-black text-gray-800 tracking-tight" href="{% url 'home' %}">
                        <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm font-black">S</div>
                        <span>StudyApp</span>
                    </a>
                    
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="{% url 'home' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition">Home</a>
                        <a href="{% url 'folders' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition">Folders</a>
                        <a href="{% url 'quizselect' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition">Lesson</a>
                        <a href="{% url 'viewquizzes' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition">View Quizzes</a>
                        <a href="{% url 'createquiz' %}" class="px-3 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition">Create Quiz</a>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <div class="relative ml-3">
                            <div>
                                <button type="button" id="profileDropdownBtn" class="flex text-sm rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition active:scale-95" aria-expanded="false" aria-haspopup="true">
                                    <span class="sr-only">Open user menu</span>
                                    {% if user.profile.image %}
                                        <img class="h-9 w-9 rounded-full object-cover border border-gray-200 shadow-sm" src="{{ user.profile.image.url }}" alt="Profile photo">
                                    {% else %}
                                        <div class="h-9 w-9 rounded-full bg-purple-600 text-white font-bold text-xs tracking-wider flex items-center justify-center shadow-sm uppercase">
                                            {{ user.username|slice:":2" }}
                                        </div>
                                    {% endif %}
                                </button>
                            </div>

                            <div id="profileDropdownMenu" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-xl shadow-lg py-1 bg-white border border-gray-100 ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="profileDropdownBtn">
                                <div class="px-4 py-2 border-b border-gray-50">
                                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Signed in as</p>
                                    <p class="text-sm font-bold text-gray-700 truncate">{{ user.username }}</p>
                                </div>
                                
                                <a href="{% url 'settings' %}" class="flex items-center px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900" role="menuitem">
                                    <i class="fa-solid fa-gear mr-2.5 text-gray-400 text-xs"></i> Account Settings
                                </a>
                                
                                <form method="POST" action="{% url 'logout' %}" class="block">
                                    {% csrf_token %}
                                    <button type="submit" class="w-full flex items-center text-left px-4 py-2 text-sm font-semibold text-rose-600 hover:bg-rose-50" role="menuitem">
                                        <i class="fa-solid fa-arrow-right-from-bracket mr-2.5 text-rose-400 text-xs"></i> Sign Out
                                    </button>
                                </form>
                            </div>
                        </div>
                    {% else %}
                        <a href="{% url 'login' %}" class="px-4 py-2 text-sm font-bold text-white bg-[#607A66] rounded-xl shadow-sm hover:bg-[#4d6352] transition">Sign In</a>
                    {% endif %}
                    
                    <div class="flex items-center md:hidden">
                        <button id="mobileMenuBtn" type="button" class="p-2 rounded-xl text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none transition">
                            <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden border-t border-gray-100 bg-white px-4 pt-2 pb-4 space-y-1 shadow-inner">
            <a href="{% url 'home' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Home</a>
            <a href="{% url 'folders' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Folders</a>
            <a href="{% url 'quizselect' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Lesson</a>
            <a href="{% url 'createquiz' %}" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition">Create Quiz</a>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const menuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuIcon = document.getElementById('menuIcon');

        menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            
            // Swap icons dynamically depending on layout status
            if (isHidden) {
                menuIcon.className = "fa-solid fa-bars text-xl";
            } else {
                menuIcon.className = "fa-solid fa-xmark text-xl";
            }
        });

        const profileBtn = document.getElementById('profileDropdownBtn');
        const profileMenu = document.getElementById('profileDropdownMenu');

        if (profileBtn && profileMenu) {
            // Toggle user dropdown on click
            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileMenu.classList.toggle('hidden');
            });

            // Close dropdown when clicking anywhere else on the page
            document.addEventListener('click', (e) => {
                if (!profileBtn.contains(e.target) && !profileMenu.contains(e.target)) {
                    profileMenu.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
