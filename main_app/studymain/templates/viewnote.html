<!DOCTYPE html>
{% extends 'base.html' %}
{% block title %}View Note - StudyApp{% endblock %}

{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Note</title>
</head>

<body>
    <h1>
        <form method="POST">
            <div class="notes-box" style="">
                {% csrf_token %}
                <input type="text" id="sample-input" class="modern-input" name="note_name" value={{searched_note}}>
                <div id="folderPopup" class="popup-menu">
                    <select name="selected_folder" id="folder-select" class="dropdown-style">
                        {% for folder in folders %}
                            <option value="{{ folder.id }}" {% if folder.id == chosen_folder_id %}selected{% endif %}>
                                {{ folder.name }}
                            </option>
                        {% empty %}
                            <option value="" disabled>No folders available. Create one first!</option>
                        {% endfor %}
                    </select>
                </div>
                <br>
                <textarea id="doc-box" name="note_text" class="underline-doc-box">{{note_text}}</textarea>
            </div>
            <button type="submit" class="save-btn">Save</button>
        </form>
            <a href="/viewnotes/{{ chosen_folder_name }}"><button class="cancel-btn">Cancel</button>
    </h1>


<style>
    .dropdown-style {
        width: 30%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: white;
        cursor: pointer;
        font-family: Verdana, sans-serif;
        margin-top: 5px;
    }

    .dropdown-style:focus {
        border-color: #000000;
        outline: none;
    }

    .modern-input {
        width: 80%;
        padding: 10px 4px;
        font-size: 20px;
        color: #000000;
        background-color: transparent;
        border: none;
        border-bottom: 2px solid green;
        border-radius: 0;
        box-sizing: border-box;
        transition: all 0.25s ease-in-out;
        font-family: Verdana, sans-serif;
    }

    .modern-input::placeholder {
        color: #aaa;
        font-style: italic;
        font-size: 18px;
    }

    .modern-input:focus {
        border-color: #607A66;
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(96, 122, 102, 0.15);
        outline: none; 
    }
    
    .input-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-family: 'Verdana, sans-serif;
        width: 100%;
    }

    .underline-doc-box {
        width: 100%;
        height: 200px;
        padding: 12px 6px;
        font-size: 15px;
        line-height: 1.6;
        color: #333;
        background-color: rgba(249, 251, 249, 0.5);
        
        border:2 px solid #e2e8e4;
        border-radius: 4px 4px 4px 4px;
        box-sizing: border-box;
        resize: vertical;
        transition: all 0.25s ease-in-out;
    }

    .underline-doc-box::placeholder {
        color: #ccc;
        font-style: normal;
    }

    .underline-doc-box:focus {
        background-color: #ffffff;
        box-shadow: 0 4px 6px -6px rgba(96, 122, 102, 0.2); 
        outline: none; /* Removes browser default outline ring */
    }
    
    .save-btn {
        position: absolute;
        bottom: 30px;
        right: 20px;
        z-index: 1000;
        font-family: Verdana, sans-serif;
        width: 60px;
        height: 35px;
        font-family: Arial, sans-serif;
        padding: 10px 20px;
        background-color: #2ecc71;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: bold;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 4px 10px rgba(46, 204, 113, 0.2);
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .save-btn:hover {
        background-color: #27ae60;
    }

    .cancel-btn {
        position: absolute;
        bottom: 30px;
        right: 90px;
        z-index: 1000;
        font-family: Verdana, sans-serif;
        width: 60px;
        height: 35px;
        background-color: transparent;
        color: #6c6c6ca8;
        border: none;
        border-radius: 4px 4px 4px 4px;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, transform 0.1s;
    }

    .cancel-btn:hover {
        background-color: #f5faf7de;
    }
</style>

{% endblock %}
