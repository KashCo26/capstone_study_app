{% extends 'base.html' %}
{% block title %}View Note - StudyApp{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4 font-sans min-h-screen relative pb-24">

    <div class="mb-8">
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">Edit Note</h1>
        <p class="text-sm text-gray-500 mt-1">Modify your content, update headings, or reassign this note to a different folder.</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white border border-gray-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
            
            <div class="w-full">
                <label for="sample-input" class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Note Title</label>
                <input type="text" 
                       id="sample-input" 
                       name="note_name" 
                       value="{{ searched_note }}"
                       placeholder="Enter note title..."
                       required
                       class="w-full md:w-5/6 px-1 py-2 text-xl font-bold text-gray-900 bg-transparent border-b-2 border-gray-200 rounded-none transition-all duration-200 focus:outline-none focus:border-[#607A66] focus:ring-4 focus:ring-[#607A66]/5"
                >
            </div>

            <div id="folderPopup" class="w-full">
                <label for="folder-select" class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Folder Name</label>
                <select name="selected_folder" 
                        id="folder-select" 
                        class="w-full sm:w-1/3 p-2.5 text-xs font-bold text-gray-700 bg-white border border-gray-200 rounded-xl cursor-pointer transition focus:outline-none focus:border-gray-400"
                >
                    {% for folder in folders %}
                        <option value="{{ folder.id }}" {% if folder.id == chosen_folder_id %}selected{% endif %}>
                            📁 {{ folder.name }}
                        </option>
                    {% empty %}
                        <option value="" disabled>No folders available. Create one first!</option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-4 border-t border-gray-100">
                <label for="doc-box" class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Notes Content</label>
                <textarea id="doc-box" 
                          name="note_text" 
                          placeholder="Start typing your study notes here..."
                          class="w-full h-96 p-4 text-sm font-medium text-gray-800 bg-gray-50/50 border border-gray-200 rounded-xl resize-y leading-relaxed transition-all duration-200 focus:outline-none focus:bg-white focus:border-gray-350"
                >{{ note_text }}</textarea>
            </div>
        </div>

        <div class="absolute bottom-8 right-4 flex items-center gap-3 z-50">
            <a href="/viewnotes/{{ chosen_folder_name }}" class="inline-block">
                <span class="px-5 py-2.5 bg-transparent hover:bg-gray-100 text-sm font-bold text-gray-500 rounded-xl transition duration-150 cursor-pointer flex items-center justify-center h-10">
                    Cancel
                </span>
            </a>
            
            <button type="submit" class="px-6 py-2.5 bg-[#607A66] hover:bg-[#4d6352] text-white font-bold text-sm rounded-xl shadow-md shadow-[#607A66]/20 transition transform active:scale-95 duration-100 flex items-center justify-center h-10">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
