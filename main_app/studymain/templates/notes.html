<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Dashboard</title>
</head>
<body>

    <h1>My Study Folders</h1>

    <div class="notes-wrapper">
        <button class="plus-btn" onclick="togglePopup()">＋</button>

        <div id="notesPopup" class="popup-menu">
            <a href="/newnote/" class="popup-item">New Note</a>
            <a href="#" class="popup-item" onclick="openFolderModal(); toggleDropdown(); return false;">New Folder</a>
        </div>
    </div>

<style>
    .notes-wrapper {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        font-family: Verdana, sans-serif;
    }

    /* Styles the circular plus button */
    .plus-btn {
        width: 45px;
        height: 45px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        transition: background 0.2s, transform 0.1s;
    }

    .plus-btn:hover {
        background-color: #27ae60;
    }

    .plus-btn:active {
        transform: scale(0.95);
    }

    .popup-menu {
        display: none;
        position: absolute;
        top: 55px;
        right: 0;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        width: 160px;
        overflow: hidden;
    }

    .popup-item {
        display: block;
        padding: 12px 16px;
        color: #333;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s;
    }

    .popup-item:hover {
        background-color: #f5f5f5;
    }

    .popup-item:not(:last-child) {
        border-bottom: 1px solid #eee;
    }
</style>

<div id="folderModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeFolderModal()">&times;</span>
        <h3>Create New Folder</h3>
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="folder_name" placeholder="Enter folder name..." required class="modal-input">
            <button type="submit" class="modal-submit-btn">Create Folder</button>
        </form>
    </div>
</div>

<style>
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4); 
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        width: 320px;
        position: relative;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 22px;
        font-weight: bold;
        color: #aaa;
        cursor: pointer;
    }

    .close-btn:hover {
        color: #333;
    }

    .modal-input {
        width: 90%;
        padding: 10px;
        margin: 15px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .modal-submit-btn {
        background-color: #607A66;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 97%;
    }

    .modal-submit-btn:hover {
        opacity: 0.9;
    }
</style>

<script>
    function togglePopup() {
        var popup = document.getElementById("notesPopup");
        if (popup.style.display === "block") {
            popup.style.display = "none";
        } else {
            popup.style.display = "block";
        }
    }
</script>

<hr>

<div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; font-family: Arial, sans-serif;">
    {% for folder in folders %}
        <div class="folder-wrapper"> 
            <button type="button" class="folder-btn" onclick="goToFolder('{{ folder.name|escapejs }}')" style="text-align: center;">
            📁<br>
            <strong id="folder-text-{{ forloop.counter }}">{{ folder.name }}</strong></button>

            <button type="button" class="action-menu-btn" onclick="toggleFolderActionMenu(event, 'menu-{{ forloop.counter }}')">&#8942;</button>

            <div id="menu-{{ forloop.counter }}" class="folder-action-dropdown">
                <a href="#" class="dropdown-item" onclick="openRenameModal(event, '{{ folder.id }}', '{{ folder.name|escapejs }}', '{{ forloop.counter }}'); return false;">Rename</a>
                <a href="#" class="dropdown-item delete-option" onclick="alert('Delete clicked for {{ folder.name|escapejs }}'); return false;">Delete</a>
            </div>
        </div>
    {% empty %}
        <p>No folders created yet. Start by creating one using the plus button above!</p>
    {% endfor %}
</div>

<div id="renameFolderModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeRenameModal()">&times;</span>
        <h3>Rename Folder</h3>
                    
        <form id="renameFolderForm" onsubmit="submitRename(event)" method="POST" action="">
            {% csrf_token %}
                <input type="hidden" id="renameFolderId" name="folder_id">
                <input type="text" id="renameInput" name="new_folder_name" placeholder="Enter new folder name..." required class="modal-input">
                <button type="submit" class="modal-submit-btn">Save Changes</button>
        </form>
    </div>
</div>

<script>
    let activeLoopIndex = null;
    function openRenameModal(event, folderId, currentName, loopIndex) {
        if (event) event.stopPropagation();
        
        var modal = document.getElementById("renameFolderModal");
        var inputField = document.getElementById("renameInput");
        var idField = document.getElementById("renameFolderId");

        inputField.value = currentName;
        if (idField) {
            idField.value = folderId;
        }
        
        activeLoopIndex = loopIndex;
        modal.style.display = "flex";
    }

    function closeRenameModal() {
        document.getElementById("renameFolderModal").style.display = "none";
    }
    
    function submitRename(event) {
        event.preventDefault();

        const form = document.getElementById('renameFolderForm');
        const formData = new FormData(form);
        const newName = formData.get('new_folder_name');
        const csrfToken = formData.get('csrfmiddlewaretoken');
        
        fetch(window.location.href, { 
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            if (response.ok) {
                // Log the active index to make sure it's tracking correctly
                console.log("Updating UI folder index:", activeLoopIndex);
                
                const textElement = document.getElementById(`folder-text-${activeLoopIndex}`);
                
                if (textElement) {
                    textElement.innerText = newName;
                    console.log("Successfully updated text element to:", newName);
                } else {
                    console.error(`Could not find HTML element with ID: folder-text-${activeLoopIndex}`);
                }
                closeRenameModal();
            } else {
                alert("Error updating folder name.");
            }
        })
    }

    function toggleDropdown() {
        var dropdown = document.getElementById("notesPopup");
        if (dropdown.style.display === "block") {
            dropdown.style.display = "none";
        } else {
            dropdown.style.display = "block";
        }
    }

    function openFolderModal() {
        document.getElementById("folderModal").style.display = "flex";
    }

    function closeFolderModal() {
        document.getElementById("folderModal").style.display = "none";
    }
</script>


<script>
    function goToFolder(folderName) {
        if (folderName) {
            var folderName = encodeURIComponent(folderName);
            window.location.href = "/viewnotes/" + folderName + "/";
        }
    }

    function toggleFolderActionMenu(event, menuId) {
        event.stopPropagation();
        
        var menus = document.getElementsByClassName("folder-action-dropdown");
        for (var i = 0; i < menus.length; i++) {
            if (menus[i].id !== menuId) {
                menus[i].style.display = "none";
            }
        }

        var targetMenu = document.getElementById(menuId);
        if (targetMenu.style.display === "block") {
            targetMenu.style.display = "none";
        } else {
            targetMenu.style.display = "block";
        }
    }

    window.onclick = function(event) {
        var modal = document.getElementById("folderModal");
        var mainPopup = document.getElementById("notesPopup");

        if (!event.target.matches('.plus-btn')) {
            if (mainPopup && mainPopup.style.display === "block") {
                mainPopup.style.display = "none";
            }
        }

        if (!event.target.matches('.action-menu-btn')) {
            var folderMenus = document.getElementsByClassName("folder-action-dropdown");
            for (var i = 0; i < folderMenus.length; i++) {
                folderMenus[i].style.display = "none";
            }
        }

        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
</script>

<style>
    .folder-wrapper {
        position: relative;
        width: 150px;
    }

    .folder-btn {
        width: 100%;
        height: 120px;
        background-color: #FFF8DC;
        padding: 15px;
        border: 2px solid #FFA500;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: background 0.2s, transform 0.1s;
    }
    
    .folder-btn:hover {
        background-color: #feeeafd3;
        cursor: pointer;
    }

    .action-menu-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        font-size: 18px;
        font-weight: bold;
        color: #777;
        cursor: pointer;
        padding: 0 6px;
        line-height: 1;
        border-radius: 4px;
        z-index: 5;
    }

    .action-menu-btn:hover {
        background-color: rgba(0, 0, 0, 0.08);
        color: #333;
    }

    .folder-action-dropdown {
        display: none;
        position: absolute;
        top: 32px;
        right: 8px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
        width: 110px;
        z-index: 10;
        overflow: hidden;
    }

    .dropdown-item {
        display: block;
        padding: 8px 12px;
        color: #333;
        text-decoration: none;
        font-size: 13px;
        text-align: left;
    }

    .dropdown-item:hover {
        background-color: #f5f5f5;
    }

    .dropdown-item.delete-option {
        color: #e74c3c;
        border-top: 1px solid #eee;
    }

    .dropdown-item.delete-option:hover {
        background-color: #fdf2f2;
    }
</style>

</body>
