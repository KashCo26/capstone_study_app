<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Dashboard</title>
</head>
<body>

    <h1>My Study Folders</h1>

    <div class="notes-wrapper">
    <button class="plus-btn" onclick="togglePopup()">＋</button>

    <div id="notesPopup" class="popup-menu">
        <a href="/newnote/" class="popup-item">New Note</a>
        <a href="#" class="popup-item" onclick="openFolderModal(); toggleDropdown(); return false;">New Folder</a>
    </div>
</div>

<style>
    /* Positions the entire wrapper in the top right corner */
    .notes-wrapper {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        font-family: Verdana, sans-serif;
    }

    /* Styles the circular plus button */
    .plus-btn {
        width: 45px;
        height: 45px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        transition: background 0.2s, transform 0.1s;
    }

    .plus-btn:hover {
        background-color: #27ae60;
    }

    .plus-btn:active {
        transform: scale(0.95);
    }

    /* Styles the popup menu box */
    .popup-menu {
        display: none; /* Hidden by default */
        position: absolute;
        top: 55px; /* Sits right below the plus button */
        right: 0;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        width: 160px;
        overflow: hidden;
    }

    /* Styles the individual links inside the popup */
    .popup-item {
        display: block;
        padding: 12px 16px;
        color: #333;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s;
    }

    .popup-item:hover {
        background-color: #f5f5f5;
    }

    /* Divider between the options */
    .popup-item:not(:last-child) {
        border-bottom: 1px solid #eee;
    }
</style>

<div id="folderModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeFolderModal()">&times;</span>
        <h3>Create New Folder</h3>
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="folder_name" placeholder="Enter folder name..." required class="modal-input">
            <button type="submit" class="modal-submit-btn">Create Folder</button>
        </form>
    </div>
</div>

<style>
    /* Styling for the background overlay */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4); 
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }

    /* Styling for the modal box itself */
    .modal-content {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        width: 320px;
        position: relative;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    /* The Close (X) Button */
    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 22px;
        font-weight: bold;
        color: #aaa;
        cursor: pointer;
    }

    .close-btn:hover {
        color: #333;
    }

    /* Input and Button styling inside modal */
    .modal-input {
        width: 90%;
        padding: 10px;
        margin: 15px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .modal-submit-btn {
        background-color: #607A66;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 97%;
    }

    .modal-submit-btn:hover {
        opacity: 0.9;
    }
</style>

<script>
    // Renamed toggle function to clearly represent the dropdown
    function toggleDropdown() {
        var dropdown = document.getElementById("notesDropdown");
        if (dropdown.style.display === "block") {
            dropdown.style.display = "none";
        } else {
            dropdown.style.display = "block";
        }
    }

    // Functions to open and close the Folder Modal
    function openFolderModal() {
        document.getElementById("folderModal").style.display = "flex";
    }

    function closeFolderModal() {
        document.getElementById("folderModal").style.display = "none";
    }

    // Close dropdown or modal if the user clicks outside of them
    window.onclick = function(event) {
        var dropdown = document.getElementById("notesDropdown");
        var modal = document.getElementById("folderModal");

        // Close dropdown if clicking outside the plus button
        if (!event.target.matches('.plus-btn')) {
            if (dropdown.style.display === "block") {
                dropdown.style.display = "none";
            }
        }

        // Close modal if clicking exactly on the background dark overlay
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }

</script>

<script>
    // JavaScript function to toggle showing/hiding the popup
    function togglePopup() {
        var popup = document.getElementById("notesPopup");
        if (popup.style.display === "block") {
            popup.style.display = "none";
        } else {
            popup.style.display = "block";
        }
    }

    // Optional: Close the popup if the user clicks anywhere else on the screen
    window.onclick = function(event) {
        if (!event.target.matches('.plus-btn')) {
            var popup = document.getElementById("notesPopup");
            if (popup.style.display === "block") {
                popup.style.display = "none";
            }
        }
    }
</script>

    <hr>

    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
        {% for folder in folders %}
            <div style="border: 2px solid #FFA500; background-color: #FFF8DC; padding: 20px; border-radius: 8px; text-align: center; width: 100px;">
                📁 <br>
                <strong>{{ folder.name }}</strong>
            </div>
        {% empty %}
            <p>No folders created yet. Start by creating one using the plus button above!</p>
        {% endfor %}
    </div>

</body>
</html>
