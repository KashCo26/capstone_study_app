{% extends 'mobile/base.html' %}

{% block content %}

<form method="POST" id="studySetForm" class="flex flex-col gap-6 max-w-2xl mx-auto pb-8">
    {% csrf_token %}

    <div class="flex flex-col gap-1 px-1">
        <label for="setNameInput" class="text-xs font-bold text-base-content/60 uppercase tracking-wider">
            Study Set Name
        </label>
        <input type="text" 
               name="set_name" 
               id="setNameInput" 
               value="{{ prefilled_name|default:'' }}" 
               placeholder="e.g., 'Biology 101 - Midterm Prep'" 
               required 
               class="w-full text-2xl font-bold tracking-tight bg-transparent py-2 border-b-2 border-base-300 focus:border-accent focus:outline-none transition-colors duration-200 placeholder:text-base-content/30 placeholder:font-normal" />
    </div>

    <div class="card bg-base-100 border border-base-300 shadow-sm hover:shadow transition-shadow rounded-2xl overflow-hidden">
        <details class="collapse group">
            <summary class="collapse-title flex items-center justify-between p-5 min-h-0 cursor-pointer select-none">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center text-lg shadow-inner">
                        <i class="fas fa-wand-magic-sparkles"></i>
                    </div>
                    <div>
                        <p class="text-xs text-light uppercase tracking-tight font-medium mt-1">GENERATE FROM A NOTE</p>
                        <h2 class="font-bold text-base-content text-base">Use notes to create</h2>
                    </div>
                </div>

                <div class="text-base-content/40 transition-transform duration-200 group-open:rotate-180">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                    </svg>
                </div>
            </summary>

            <div class="collapse-content px-5 pb-5 pt-2 border-t border-base-200/60 flex flex-col gap-3 items-end">
                <select name="note_source" id="noteSelect" class="select select-bordered w-full text-sm bg-base-100">
                    <option value="">Choose a note...</option>
                    {% for folder in folders %}
                        <optgroup label="{{ folder.name }}" class="font-bold">
                            {% for note in folder.notes.all %}
                                <option value="{{ note.id }}">{{ note.name }}</option>
                            {% empty %}
                                <option value="" disabled>No notes available in this folder.</option>
                            {% endfor %}
                        </optgroup>
                    {% empty %}
                        <option value="" disabled>No subject folders available.</option>
                    {% endfor %}
                </select>

                <button type="submit" id="generateBtn" name="action" value="generate_ai" formnovalidate class="btn btn-accent btn-sm px-5 text-xs font-semibold gap-1.5 rounded-lg shadow-sm">
                    Generate
                </button>
            </div>
        </details>
    </div>

    <div class="space-y-4 pt-2">

        <div id="flashcardContainer" class="space-y-4">
            {% if prefilled_cards %}
                {% for card in prefilled_cards %}
                    <div class="card-item bg-base-100 border border-base-300 rounded-2xl p-6 shadow-sm relative flex flex-col md:flex-row md:gap-4 gap-4 transition-all duration-200">
                        <span class="absolute top-4 left-6 text-[10px] font-extrabold text-base-content/50 uppercase tracking-widest card-number">
                            Card {{ forloop.counter }}
                        </span>

                        <button type="button" class="delete-card-btn absolute top-3 right-4 text-gray-400 hover:text-red-500 transition p-1 text-sm cursor-pointer" title="Delete this card">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                        
                        <div class="flex-1 pt-6">
                            <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Question</label>
                            <textarea name="question[]" rows="3" required placeholder="Enter question or prompt..."
                                class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none">{{ card.question }}</textarea>
                        </div>
                        
                        <div class="flex-1 pt-0 md:pt-6">
                            <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Answer</label>
                            <textarea name="answer[]" rows="3" required placeholder="Enter definitive answer..."
                                class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none">{{ card.answer }}</textarea>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="card-item bg-base-100 border border-base-300 rounded-2xl p-6 shadow-sm relative flex flex-col md:flex-row md:gap-4 gap-4 transition-all duration-200">
                    <span class="absolute top-4 left-6 text-[10px] font-extrabold text-base-content/50 uppercase tracking-widest card-number">
                        Card 1
                    </span>

                    <button type="button" class="delete-card-btn absolute top-3 right-4 text-gray-400 hover:text-red-500 transition p-1 text-sm cursor-pointer" title="Delete this card">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    
                    <div class="flex-1 pt-6">
                        <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Question</label>
                        <textarea name="question[]" rows="3" placeholder="Enter question or prompt..." required
                            class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                    </div>
                    
                    <div class="flex-1 pt-0 md:pt-6">
                        <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Answer</label>
                        <textarea name="answer[]" rows="3" placeholder="Enter definitive answer..." required
                            class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                    </div>
                </div>
            {% endif %}
        </div>

        <button type="button" id="addCardBtn" title="Add dynamic card row" class="col-span-full text-center py-3 px-4 bg-base-100 border-2 border-dashed border-base-300 hover:border-primary/50 transition-colors rounded-2xl w-full cursor-pointer">
            <p class="text-sm font-medium text-base-content">+ Add a card</p>
        </button>
    </div>

    <button type="submit" class="btn btn-accent w-full">
        Create Study Set
    </button>
</form>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('flashcardContainer');
        const addBtn = document.getElementById('addCardBtn');
        const generateBtn = document.getElementById('generateBtn');
        const noteSelect = document.getElementById('noteSelect');

        function updateCardNumbers() {
            const cards = container.querySelectorAll('.card-item');
            cards.forEach((card, index) => {
                const numberTag = card.querySelector('.card-number');
                if (numberTag) {
                    numberTag.textContent = `Card ${index + 1}`;
                }
            });
        }

        addBtn.addEventListener('click', () => {
            const cardCount = container.querySelectorAll('.card-item').length + 1;
            
            const newCard = document.createElement('div');
            newCard.className = 'card-item bg-base-100 border border-base-300 rounded-2xl p-6 shadow-sm relative flex flex-col md:flex-row md:gap-4 gap-4 transition-all duration-200';
            newCard.innerHTML = `
                <span class="absolute top-4 left-6 text-[10px] font-extrabold text-base-content/50 uppercase tracking-widest card-number">
                    Card ${cardCount}
                </span>

                <button type="button" class="delete-card-btn absolute top-3 right-4 text-gray-400 hover:text-red-500 transition p-1 text-sm cursor-pointer" title="Delete this card">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                
                <div class="flex-1 pt-6">
                    <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Question</label>
                    <textarea name="question[]" rows="3" placeholder="Enter question or prompt..." required
                        class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                </div>
                
                <div class="flex-1 pt-0 md:pt-6">
                    <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Answer</label>
                    <textarea name="answer[]" rows="3" placeholder="Enter definitive answer..." required
                        class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                </div>
            `;
            
            container.appendChild(newCard);
        });

        container.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.delete-card-btn');
            if (deleteBtn) {
                const cards = container.querySelectorAll('.card-item');
                if (cards.length > 1) {
                    const cardItem = deleteBtn.closest('.card-item');
                    cardItem.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => {
                        cardItem.remove();
                        updateCardNumbers();
                    }, 150);
                } else {
                    alert("A study set must contain at least 1 card.");
                }
            }
        });

        generateBtn.addEventListener('click', (e) => {
            if (!noteSelect.value) {
                e.preventDefault();
                noteSelect.reportValidity();
            }
        });
    });
</script>

{% endblock %}
