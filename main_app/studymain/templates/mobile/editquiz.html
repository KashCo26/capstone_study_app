{% extends 'mobile/base.html' %}

{% block content %}

<form method="POST" id="studySetForm" class="flex flex-col gap-6 max-w-2xl mx-auto pb-8">
    {% csrf_token %}
    <div class="flex flex-row items-end justify-between gap-4">
        <div class="flex flex-col gap-1 px-1 flex-1">
            <label for="setNameInput" class="text-xs font-bold text-base-content/60 uppercase tracking-wider">
                Study Set Name
            </label>
            <input type="text" 
                name="set_name" 
                id="setNameInput" 
                value="{{ study_set.name }}" 
                placeholder="e.g., 'Biology 101 - Midterm Prep'" 
                required 
                class="w-full text-2xl font-bold tracking-tight bg-transparent py-2 border-b-2 border-base-300 focus:border-accent focus:outline-none transition-colors duration-200 placeholder:text-base-content/30 placeholder:font-normal" />
        </div>

        <button type="button" id="deleteSetBtn" class="btn btn-error btn-square" title="Delete Study Set">
            <i class="fas fa-minus text-xl"></i>
        </button> 
    </div>

    <div class="space-y-4 pt-2">
        <div id="flashcardContainer" class="space-y-4">
            {% for card in cards %}
                <div class="card-item bg-base-100 border border-base-300 rounded-2xl p-6 shadow-sm relative flex flex-col md:flex-row md:gap-4 gap-4 transition-all duration-200">
                    <input type="hidden" name="card_id[]" value="{{ card.id }}">

                    <span class="absolute top-4 left-6 text-[10px] font-extrabold text-base-content/50 uppercase tracking-widest card-number">
                        Card {{ forloop.counter }}
                    </span>

                    <button type="button" class="delete-card-btn absolute top-3 right-4 text-gray-400 hover:text-red-500 transition p-1 text-sm cursor-pointer" title="Delete this card">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    
                    <div class="flex-1 pt-6">
                        <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Question</label>
                        <textarea name="question[]" rows="3" required placeholder="Enter question or prompt..."
                            class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none">{{ card.front }}</textarea>
                    </div>
                    
                    <div class="flex-1 pt-0 md:pt-6">
                        <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Answer</label>
                        <textarea name="answer[]" rows="3" required placeholder="Enter definitive answer..."
                            class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none">{{ card.back }}</textarea>
                    </div>
                </div>
            {% endfor %}
        </div>

        <button type="button" id="addCardBtn" title="Add dynamic card row" class="col-span-full text-center py-3 px-4 bg-base-100 border-2 border-dashed border-base-300 hover:border-primary/50 transition-colors rounded-2xl w-full cursor-pointer">
            <p class="text-sm font-medium text-base-content">+ Add a card</p>
        </button>
    </div>

    <div class="flex flex-row w-full gap-2">
        <button type="submit" name="action" value="save" class="btn btn-accent flex-1">
            Save Study Set
        </button>
        <button type="submit" id="namegenerateBtn" name="action" value="generate_ai" formnovalidate class="btn btn-primary">
            <i class="fas fa-wand-magic-sparkles text-xl"></i>
            AI
        </button>    
    </div>
</form>

<dialog id="delete_modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Delete Study Set?</h3>
        <p class="py-4 text-sm text-base-content/70">Are you sure you want to delete this study set? This action cannot be undone.</p>
        <div class="modal-action flex flex-row">
            <form method="dialog">
                <button class="btn btn-ghost">Cancel</button>
            </form>
            <button type="button" id="confirmDeleteBtn" class="btn btn-error">Delete</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('studySetForm');
        const container = document.getElementById('flashcardContainer');
        const addBtn = document.getElementById('addCardBtn');
        const namegenerateBtn = document.getElementById('namegenerateBtn');
        const setNameInput = document.getElementById('setNameInput');

        const deleteSetBtn = document.getElementById('deleteSetBtn');
        const deleteModal = document.getElementById('delete_modal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        deleteSetBtn.addEventListener('click', () => {
            deleteModal.showModal();
        });

        confirmDeleteBtn.addEventListener('click', () => {
            const hiddenAction = document.createElement('input');
            hiddenAction.type = 'hidden';
            hiddenAction.name = 'action';
            hiddenAction.value = 'delete_set';
            form.appendChild(hiddenAction);

            form.noValidate = true;
            form.submit();
        });

        function updateCardNumbers() {
            const cards = container.querySelectorAll('.card-item');
            cards.forEach((card, index) => {
                const numberTag = card.querySelector('.card-number');
                if (numberTag) {
                    numberTag.textContent = `Card ${index + 1}`;
                }
            });
        }

        addBtn.addEventListener('click', () => {
            const cardCount = container.querySelectorAll('.card-item').length + 1;
            
            const newCard = document.createElement('div');
            newCard.className = 'card-item bg-base-100 border border-base-300 rounded-2xl p-6 shadow-sm relative flex flex-col md:flex-row md:gap-4 gap-4 transition-all duration-200';
            newCard.innerHTML = `
                <input type="hidden" name="card_id[]" value="">

                <span class="absolute top-4 left-6 text-[10px] font-extrabold text-base-content/50 uppercase tracking-widest card-number">
                    Card ${cardCount}
                </span>

                <button type="button" class="delete-card-btn absolute top-3 right-4 text-gray-400 hover:text-red-500 transition p-1 text-sm cursor-pointer" title="Delete this card">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                
                <div class="flex-1 pt-6">
                    <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Question</label>
                    <textarea name="question[]" rows="3" placeholder="Enter question or prompt..." required
                        class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                </div>
                
                <div class="flex-1 pt-0 md:pt-6">
                    <label class="block text-xs font-bold text-base-content/60 uppercase tracking-wide mb-1.5">Answer</label>
                    <textarea name="answer[]" rows="3" placeholder="Enter definitive answer..." required
                        class="textarea textarea-bordered textarea-primary w-full text-sm focus:outline-none resize-none"></textarea>
                </div>
            `;
            
            container.appendChild(newCard);
        });

        container.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.delete-card-btn');
            if (deleteBtn) {
                const cards = container.querySelectorAll('.card-item');
                if (cards.length > 1) {
                    const cardItem = deleteBtn.closest('.card-item');
                    cardItem.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => {
                        cardItem.remove();
                        updateCardNumbers();
                    }, 150);
                } else {
                    alert("A study set must contain at least 1 card.");
                }
            }
        });

        if (namegenerateBtn) {
            namegenerateBtn.addEventListener('click', (e) => {
                if (!setNameInput.value.trim()) {
                    e.preventDefault();
                    setNameInput.reportValidity();
                }
            });
        }
    });
</script>

{% endblock %}
