{% extends 'desktop/base.html' %}
{% block title %}Take Quiz - StudyApp{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4 font-sans">
    
    <div class="mb-6 flex justify-between items-center px-2">
        <span class="text-lg font-black text-gray-900 tracking-tight">StudyApp <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold ml-1 uppercase tracking-wide">AI Powered</span></span>
        <div class="flex items-center space-x-2 text-sm font-semibold text-gray-600 bg-gray-100 px-3 py-1.5 rounded-xl">
            <i class="fa-solid fa-clock text-emerald-500"></i>
            <span>Time left: <span id="quiz-timer" class="font-mono font-bold text-gray-950">15:00</span></span>
        </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-6 relative">
        
        <div class="flex justify-between items-start pb-4 border-b border-gray-100">
            <div>
                <span id="question-tracker" class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">
                    Question 1 of {{ cards|length }}
                </span>
                <h2 id="current-question-text" class="text-xl font-bold text-gray-900 leading-tight"></h2>
            </div>
            <button type="button" onclick="handleEndSession()"
                class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-xl tracking-wider uppercase transition shadow-sm border border-red-100 shrink-0 ml-4">
                End
            </button>
        </div>

        <div id="feedback-banner" class="hidden p-4 rounded-xl border font-semibold text-sm transition-all">
            <p id="feedback-message"></p>
            <p id="correct-answer-reveal" class="mt-1 text-xs font-normal text-gray-600"></p>
        </div>

        <form id="quizSubmitForm" onsubmit="handleFormAction(event)" class="space-y-3">
            {% csrf_token %}
            
            <div id="options-container" class="space-y-3"></div>

            <div class="pt-4 flex justify-center">
                <button type="submit" id="action-btn"
                    class="px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl shadow-md shadow-emerald-500/20 tracking-wider uppercase transition transform active:scale-98 flex items-center space-x-2">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span id="btn-text">Submit</span>
                </button>
            </div>
        </form>
    </div>

    <div class="mt-6 bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Session Progress</span>
            <span id="progress-text" class="text-xs font-mono font-bold text-gray-600">0% Completed</span>
        </div>
        <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-[#607A66] h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>
</div>

<script>
    const cardsArray = [
        {% for card in cards %}
            { 
                "id": "{{ card.id }}", 
                "front": "{{ card.front|escapejs }}",
                "back": "{{ card.back|escapejs }}",
                "ai_distractors": {% if card.ai_distractors %}{{ card.ai_distractors|safe }}{% else %}[]{% endif %}
            }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    let totalTimeInSeconds = 15 * 60; 
    let timerInterval;

    function startTimer() {
        const timerDisplay = document.getElementById('quiz-timer');
        
        timerInterval = setInterval(() => {
            let minutes = Math.floor(totalTimeInSeconds / 60);
            let seconds = totalTimeInSeconds % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.innerText = `${minutes}:${seconds}`;

            if (totalTimeInSeconds <= 0) {
                clearInterval(timerInterval);
                handleTimeExpired();
            } else {
                totalTimeInSeconds--;
            }
        }, 1000);
    }

    function handleTimeExpired() {
        alert("⏱️ Time's up! The session has expired.");
        window.location.href = `/flashcard_summary/${encodeURIComponent({{ set_id }})}/?correct=${correctCount}&wrong=${wrongCount}`;
    }

    function stopTimerInstance() {
        clearInterval(timerInterval);
    }

    let currentQuestionIndex = 0;
    let isShowingFeedback = false; 
    let currentShuffledOptions = [];

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function renderQuestion() {
        if (cardsArray.length === 0 || currentQuestionIndex >= cardsArray.length) {
            handleQuizCompletion();
            return;
        }

        const currentCard = cardsArray[currentQuestionIndex];
        isShowingFeedback = false;
        
        document.getElementById('feedback-banner').className = "hidden";
        document.getElementById('btn-text').innerText = "Submit";
        document.getElementById('action-btn').className = "px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl shadow-md shadow-emerald-500/20 tracking-wider uppercase transition transform active:scale-98 flex items-center space-x-2";

        document.getElementById('current-question-text').innerText = currentCard.front;
        document.getElementById('question-tracker').innerText = `Question ${currentQuestionIndex + 1} of ${cardsArray.length}`;
        
        const pool = [currentCard.back, ...currentCard.ai_distractors];
        currentShuffledOptions = shuffleArray([...pool]);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        currentShuffledOptions.forEach((optionText, index) => {
            optionsContainer.innerHTML += `
                <label class="flex items-center p-4 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:border-[#607A66] hover:bg-[#607A66]/5 transition group">
                    <input type="radio" name="quiz_choice" value="${optionText}" required
                        class="w-4 h-4 text-[#607A66] border-gray-300 focus:ring-[#607A66]/10 transition">
                    <span class="ml-4 text-sm font-semibold text-gray-750 group-hover:text-gray-900 transition">
                        ${optionText}
                    </span>
                </label>
            `;
        });

        const completionPercentage = Math.round((currentQuestionIndex / cardsArray.length) * 100);
        document.getElementById('progress-text').innerText = `${completionPercentage}% Completed`;
        document.getElementById('progress-bar').style.width = `${completionPercentage}%`;
    }

    var correctCount = 0;
    var wrongCount = 0;
    
    function handleFormAction(event) {
        event.preventDefault();
        const currentCard = cardsArray[currentQuestionIndex];

        if (!isShowingFeedback) {
            const formElement = document.getElementById('quizSubmitForm');
            const formData = new FormData(formElement);
            const userSelection = formData.get('quiz_choice');

            const feedbackBanner = document.getElementById('feedback-banner');
            const feedbackMessage = document.getElementById('feedback-message');
            const correctAnswerReveal = document.getElementById('correct-answer-reveal');

            if (userSelection === currentCard.back) {
                feedbackBanner.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 font-bold block";
                feedbackMessage.innerText = "✓ Correct Answer!";
                correctAnswerReveal.innerText = "";
                correctCount++;
            } else {
                feedbackBanner.className = "p-4 rounded-xl border bg-red-50 border-red-200 text-red-800 font-bold block";
                feedbackMessage.innerText = "✕ Incorrect Option Selected.";
                correctAnswerReveal.innerText = `Correct Target: ${currentCard.back}`;
                wrongCount++;
            }

            document.querySelectorAll('input[name="quiz_choice"]').forEach(el => el.disabled = true);

            document.getElementById('btn-text').innerText = "Next Question";
            document.getElementById('action-btn').className = "px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white font-black rounded-xl shadow-md shadow-blue-500/20 tracking-wider uppercase transition transform active:scale-98 flex items-center space-x-2";
            isShowingFeedback = true;

        } else {
            currentQuestionIndex++;
            document.getElementById('quizSubmitForm').reset();
            renderQuestion();
        }
    }

    function handleQuizCompletion() {
        document.getElementById('progress-text').innerText = `100% Completed`;
        document.getElementById('progress-bar').style.width = `100%`;
        alert("Quiz finished! Great job tracking your target study metrics.");
        window.location.href = `/flashcard_summary/${encodeURIComponent({{ set_id }})}/?correct=${correctCount}&wrong=${wrongCount}`;
    }

    function handleEndSession() {
        if (confirm("Are you sure you want to end this session early? Your progress will not be saved."))
        window.location.href = `/flashcard_summary/${encodeURIComponent({{ set_id }})}/?correct=${correctCount}&wrong=${wrongCount}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (cardsArray.length === 0) {
            document.getElementById('current-question-text').innerText = "No study cards loaded into session pipeline.";
        } else {
            renderQuestion();
            startTimer();
        }
    });
</script>

{% endblock %}
